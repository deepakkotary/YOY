<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Only You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 1rem;
      text-align: center;
    }

   footer {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    section {
      margin-bottom: 2rem;
    }

    @media (max-width: 600px) {
      main {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>You Only You</h1>
  </header>

  <footer>
    <section id="home">
      <h2>Welcome</h2>
      <p>This is a basic and responsive HTML template.</p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>Add information about you or your website here.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email: example@email.com</p>
    </section>
  </footer>

</body>
</html>
